# Builds the image from the Dockerfile and pushes it to ghcr.io/its-arab/blender-cuda when the
# Dockerfile changes, or by hand from the Actions tab.
name: image
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [Dockerfile]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/its-arab/blender-cuda:5.2.3,ghcr.io/its-arab/blender-cuda:latest
